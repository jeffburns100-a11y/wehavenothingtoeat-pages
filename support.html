<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Support — We Have Nothing To Eat</title>
<style>
  body { font-family: -apple-system, system-ui, sans-serif; max-width: 640px; margin: 40px auto; padding: 0 20px; line-height: 1.6; color: #222; }
  h1 { font-size: 1.6em; }
  label { display: block; font-weight: 600; margin-top: 16px; margin-bottom: 4px; }
  input, textarea { width: 100%; padding: 10px; font-size: 1em; border: 1px solid #ccc; border-radius: 6px; box-sizing: border-box; font-family: inherit; }
  textarea { min-height: 120px; resize: vertical; }
  button { margin-top: 20px; padding: 10px 24px; font-size: 1em; background: #2e7d32; color: white; border: none; border-radius: 6px; cursor: pointer; }
  button:hover { background: #26692a; }
  .success { color: #2e7d32; font-weight: 600; }
</style>
</head>
<body>
<h1>Support</h1>
<p>
  Need help with We Have Nothing To Eat, found a bug, or have a question about your account
  or data? Send us a message below and we'll get back to you.
</p>

<form action="https://formspree.io/f/xnjeoqjw" method="POST">
  <label for="email">Your email</label>
  <input type="email" id="email" name="email" required>

  <label for="message">Message</label>
  <textarea id="message" name="message" required></textarea>

  <button type="submit">Send</button>
</form>
</body>
</html>
